name: Desktop release

# Builds the Tauri shell's installer bundles on the three platforms, signs
# what can be signed, and on a `desktop-v*` tag publishes them with the
# updater manifests. WP9 of .plans/2026-10-02-rust-core-and-tauri-shell.md;
# apps/desktop/README.md (Release) describes the whole flow.
#
#   macOS    `.app` and `.dmg`, Apple silicon. The Tauri bundler signs with
#            the Developer ID certificate from a throwaway keychain
#            (signing-keychain.sh) and notarises the `.app`;
#            notarize-dmg.sh then notarises the image.
#   Linux    `.deb` and `.AppImage`, x86_64.
#   Windows  `.msi` and NSIS `.exe`, x86_64. Not code-signed: there is no
#            Windows certificate.
#
# Every bundle carries `steno-speech-sidecar` beside the app's binary
# (tauri.release.conf.json, stage-sidecar.sh, checked by check-bundle.sh).
# Every updater artifact gets a `.sig` from TAURI_SIGNING_PRIVATE_KEY, the
# private half of `plugins.updater.pubkey` in tauri.conf.json (no password).
#
# A pushed `desktop-v<version>` tag builds all three platforms and
# publishes; the version must be the one under `[workspace.package]` in
# Cargo.toml. The prefix keeps clear of the Swift release.yml's `v*` and
# mobile-cd.yml's `ios-fp-*`. A manual run builds the platforms it is given
# as workflow artifacts and publishes nothing.
#
# Publishing writes one GitHub release per tag with every bundle, its `.sig`
# and `latest.json`, then copies the manifest to the rolling `desktop-beta`
# lane and, for a release without a hyphen, `desktop-stable` (the lanes
# `updater.rs` reads). Every release here is a pre-release and never
# "latest": until the Mac cutover (.plans/2026-10-04-mac-cutover.md) the
# "latest release" belongs to the Swift app.
#
# `cargo deny check` (deny.toml) must pass before any bundle builds. The
# bundles carry the real host; the opt-in `fixture-host` feature stays out.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build (comma-separated: linux, windows, macos)'
        type: string
        default: 'linux,windows,macos'

concurrency:
  group: desktop-release-${{ github.ref }}
  # A tag run is never cut off halfway through publishing.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  # The version and the platforms. A job-level `if` cannot read the matrix,
  # so release-matrix.sh turns the input into the include list.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version" || { echo "::error::no version under [workspace.package] in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the workspace version $version; tag desktop-v$version or bump [workspace.package] first"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version prerelease=$prerelease"
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos' }}
          MACOS_RUNS_ON: ${{ vars.MACOS_RUNS_ON || '"macos-15"' }}
        run: |
          set -euo pipefail
          matrix="$(apps/desktop/scripts/release-matrix.sh)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  bundle:
    name: ${{ matrix.name }}
    needs: [plan, deny]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Keeps the runner's source paths out of release panics. Set for the
      # job so the sidecar and the app share one dependency build.
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=steno
      # macOS only (signing-keychain.sh). Outside the workspace and named
      # apart from the Swift release's, which may share the runner.
      KEYCHAIN_PATH: ${{ github.workspace }}/../steno-desktop-release.keychain-db
      KEYCHAINS_BEFORE: ${{ github.workspace }}/../steno-desktop-release.keychains-before
    steps:
      - uses: actions/checkout@v4

      # Before any tool is installed or built: name every missing secret.
      - name: Check secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ matrix.name == 'macos' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ matrix.name == 'macos' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          ASC_KEY_ID: ${{ matrix.name == 'macos' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ matrix.name == 'macos' && secrets.ASC_ISSUER_ID || '' }}
          ASC_PRIVATE_KEY: ${{ matrix.name == 'macos' && secrets.ASC_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          names=(TAURI_SIGNING_PRIVATE_KEY)
          if [ "${{ matrix.name }}" = macos ]; then
            names+=(MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY)
          fi
          apps/desktop/scripts/require-secrets.sh "${names[@]}"

      - name: Linux prerequisites
        if: matrix.name == 'linux'
        run: scripts/setup-linux.sh

      - name: Use the installed rustup (self-hosted runners only)
        if: runner.environment == 'self-hosted'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/run/current-system/sw/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - name: Target directory outside the workspace (self-hosted runners only)
        if: runner.environment == 'self-hosted'
        run: |
          target="$HOME/Library/Caches/steno-ci/$RUNNER_NAME/cargo-target"
          mkdir -p "$target"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          echo "STENO_TARGET_DIR=$target" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/macos/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/macos/web/pnpm-lock.yaml

      # The web UI first (beforeBuildCommand would build it again; the
      # config merge below drops that so the CLI does not run pnpm twice).
      - name: Web install and build
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/macos/web

      - name: Speech sidecar
        shell: bash
        run: apps/desktop/scripts/stage-sidecar.sh

      # The bundler signs with the identity this prints. The App Store
      # Connect key serves the bundler and notarize-dmg.sh; the last step
      # removes it.
      - name: Signing keychain and notarisation key
        if: matrix.name == 'macos'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          identity="$(apps/desktop/scripts/signing-keychain.sh import "$KEYCHAIN_PATH" "$KEYCHAINS_BEFORE")"
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077 && printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path")
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "ASC_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      # The Tauri CLI as the prebuilt npm package, pinned to the `tauri`
      # crate's version in Cargo.lock because it sees the signing keys.
      # tauri.release.conf.json adds the sidecar; on Windows
      # tauri.release.windows.conf.json adds the DirectML.dll it loads.
      - name: Bundle
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # macOS: the bundler notarises when all three are set (it only
          # warns when one is missing; check-bundle.sh then fails).
          APPLE_API_KEY: ${{ matrix.name == 'macos' && secrets.ASC_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.name == 'macos' && secrets.ASC_ISSUER_ID || '' }}
          APPLE_API_KEY_PATH: ${{ env.ASC_KEY_PATH }}
        run: |
          set -euo pipefail
          configs=(--config tauri.release.conf.json)
          if [ "${{ matrix.name }}" = windows ]; then
            configs+=(--config tauri.release.windows.conf.json)
          fi
          pnpm dlx @tauri-apps/cli@2.12.1 build --ci \
            --bundles "${{ matrix.bundles }}" "${configs[@]}" \
            --config '{"build":{"beforeBuildCommand":null}}'

      - name: Notarise the disk image
        if: matrix.name == 'macos'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmgs=("${STENO_TARGET_DIR:-target}"/release/bundle/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 && -f "${dmgs[0]}" ]] || { echo "::error::expected one .dmg, found ${dmgs[*]}"; exit 1; }
          apps/desktop/scripts/notarize-dmg.sh "${dmgs[0]}"

      - name: Check the bundles
        shell: bash
        run: |
          set -euo pipefail
          signed=()
          if [ "${{ matrix.name }}" = macos ]; then signed=(--signed); fi
          apps/desktop/scripts/check-bundle.sh "${signed[@]}" \
            "${STENO_TARGET_DIR:-target}/release/bundle" "${{ matrix.bundles }}"

      # A self-hosted runner keeps its target directory outside the
      # workspace; the upload step reads from the workspace.
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          src="${STENO_TARGET_DIR:-target}/release/bundle"
          mkdir -p target/release
          if [ "$src" != "target/release/bundle" ]; then
            rm -rf target/release/bundle
            cp -R "$src" target/release/bundle
          fi
          find target/release/bundle -maxdepth 2 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: steno-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.artifacts }}
            target/release/bundle/**/*.sig
          if-no-files-found: error

      - name: Remove keychain and keys
        if: always() && matrix.name == 'macos'
        run: |
          apps/desktop/scripts/signing-keychain.sh remove "$KEYCHAIN_PATH" "$KEYCHAINS_BEFORE"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    name: publish
    if: github.ref_type == 'tag'
    needs: [plan, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: steno-desktop-*
          path: dist
          merge-multiple: true

      # One flat directory of release assets. The macOS updater archive is
      # `Steno.app.tar.gz` on every version; it gets the version and the
      # architecture the other assets carry (its signature covers the
      # bytes, not the name).
      - name: Assets
        run: |
          set -euo pipefail
          mkdir -p assets
          find dist -type f -exec mv -t assets {} +
          if [ -f assets/Steno.app.tar.gz ]; then
            mv assets/Steno.app.tar.gz "assets/Steno_${VERSION}_aarch64.app.tar.gz"
            mv assets/Steno.app.tar.gz.sig "assets/Steno_${VERSION}_aarch64.app.tar.gz.sig"
          fi
          ls -l assets

      # Every signature against the public key the installed apps verify
      # with, so a secret that is not the config key's other half fails
      # here and not on every user's next update.
      - name: Verify the updater signatures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign >/dev/null
          pubkey="$(jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json | base64 --decode)"
          printf '%s\n' "$pubkey" > "$RUNNER_TEMP/updater.pub"
          count=0
          for sig in assets/*.sig; do
            base64 --decode "$sig" > "$RUNNER_TEMP/signature.minisig"
            minisign -V -q -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/signature.minisig" -m "${sig%.sig}"
            count=$((count + 1))
          done
          test "$count" -eq 5 || { echo "::error::expected five updater signatures, found $count"; exit 1; }
          echo "verified $count updater signatures"

      - name: Updater manifest
        run: |
          set -euo pipefail
          apps/desktop/scripts/updater-manifest.sh "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" assets > assets/latest.json
          cat assets/latest.json

      - name: Publish the release
        run: |
          set -euo pipefail
          notes="Steno desktop $VERSION: macOS (Apple silicon, signed and notarised), Linux (.deb, AppImage) and Windows (.msi, setup .exe; not code-signed, so SmartScreen asks before the first install). The Mac app on the Swift releases stays the one to install on macOS until the cutover."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing assets"
          else
            gh release create "$TAG" --draft --prerelease --latest=false \
              --verify-tag --title "Steno desktop $VERSION" --notes "$notes"
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          gh release view "$TAG" --json url --jq .url

      # After the release is public, so the manifest's URLs resolve. Each
      # lane is a release holding only latest.json, its tag on this commit.
      # A release moves the beta lane too, unless it serves a pre-release
      # of a later version (0.3.0-rc.1 stays when 0.2.1 ships).
      - name: Update lanes
        run: |
          set -euo pipefail
          lanes=(desktop-beta)
          if [ "$PRERELEASE" != true ]; then
            lanes=(desktop-stable)
            beta="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-beta/latest.json" | jq -r .version || true)"
            newest="$(printf '%s\n%s\n' "${beta%%-*}" "$VERSION" | sort -V | tail -n 1)"
            if [ -z "$beta" ] || [ "$newest" = "$VERSION" ]; then
              lanes+=(desktop-beta)
            else
              echo "the beta lane keeps $beta, a later version than $VERSION"
            fi
          fi
          for lane in "${lanes[@]}"; do
            notes="The update manifest of the ${lane#desktop-} lane: Steno desktop $VERSION ($TAG). Installed desktop apps read latest.json from here; the installers are on $TAG."
            if gh release view "$lane" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$lane" -f sha="$GITHUB_SHA" -F force=true >/dev/null
              gh release edit "$lane" --notes "$notes" --prerelease --latest=false
            else
              gh release create "$lane" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "Steno desktop updates (${lane#desktop-})" --notes "$notes"
            fi
            gh release upload "$lane" assets/latest.json --clobber
            echo "$lane serves $VERSION"
          done
