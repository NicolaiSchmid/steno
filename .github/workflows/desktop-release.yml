name: Desktop release

# Builds the Tauri shell's installer bundles on the three platforms, signs
# what can be signed, and on a `v*` tag publishes them with the updater
# manifests: the Steno release (stable plan D1, "Release mechanics" in
# .plans/2026-10-07-stable-promotion.md). apps/desktop/README.md (Release)
# describes the whole flow.
#
#   macOS    `.app` and `.dmg`, Apple silicon. The Tauri bundler signs with
#            the Developer ID certificate from a throwaway keychain
#            (signing-keychain.sh) and notarises the `.app`;
#            notarize-dmg.sh then notarises the image.
#   Linux    `.deb` and `.AppImage`, x86_64. A detached OpenPGP signature
#            (`.asc`) beside each.
#   Windows  `.msi` and NSIS `-setup.exe`, x86_64. Not code-signed: there
#            is no Windows certificate. The MSI version comes from
#            wix-version.sh, since WiX takes numbers only.
#
# Every bundle carries `steno-speech-sidecar` beside the app's binary
# (tauri.release.conf.json, stage-sidecar.sh, checked by check-bundle.sh).
# Every updater artifact gets a `.sig` from TAURI_SIGNING_PRIVATE_KEY, the
# private half of `plugins.updater.pubkey` in tauri.conf.json (no password).
#
# A `v<version>` tag (the `[workspace.package]` version) builds all three
# platforms and publishes; a manual run builds the platforms it is given
# and publishes nothing. The build number, CFBundleVersion on the Mac, is
# the commit count, above every build on the `appcast` branch (Sparkle
# orders by it alone), and `check-bundle.sh --signed --handoff` holds the
# `.app` to what the Swift app's last update needs. A tag run also signs
# the Sparkle handoff item (handoff-item.sh, the `sparkle-item` artifact).
# The old `desktop-v*` tags stay; nothing builds them again.
#
# `assets` then gathers every bundle into one directory (release-assets.sh),
# checks the updater signatures, writes `latest.json`, and checksums and
# signs the lot (release-signatures.sh): `SHA256SUMS` over every asset, and
# a detached OpenPGP signature (`.asc`) for it and for each Linux bundle
# with the release signing key (LINUX_GPG_PRIVATE_KEY), verified against
# the committed apps/desktop/release-signing-key.asc. On a tag the result
# is the `desktop-release-assets` artifact, which `publish` uploads. A
# manual run signs and verifies too, which proves the key and its
# passphrase, but keeps only `SHA256SUMS` and what was verified
# (`desktop-release-checksums`), so no signature for an unpublished build
# leaves the runner. Only `assets`
# signs; `plan` learns only whether the two secrets are set, and neither the
# bundle jobs nor `publish` sees them.
#
# Publishing writes one GitHub release per tag with those assets, then
# updates the rolling `desktop-beta` and `desktop-stable` lanes that
# `updater.rs` reads (updater-lanes.sh decides which). A version with a
# hyphen is a pre-release and never "latest". A stable version is "latest",
# carries the `appcast` branch's feed as `appcast.xml` (the feed of the
# first Swift release, which reads `releases/latest`), bumps the Homebrew
# cask and the AUR package once their secrets exist, and puts the Nix flake
# lines in the summary. Then the `handoff` job, behind the `appcast`
# environment's required reviewer, puts the handoff item on the `appcast`
# branch, once: it runs again only for the version named by the repository
# variable HANDOFF_ITEM_REPLACE.
#
# `cargo deny check` (deny.toml) must pass before any bundle builds. The
# bundles carry the real host; the opt-in `fixture-host` feature stays out.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build (comma-separated: linux, windows, macos)'
        type: string
        default: 'linux,windows,macos'

concurrency:
  group: desktop-release-${{ github.ref }}
  # A manual run on a branch replaces the one before it. Nothing cancels a
  # run on a tag ref, so a tag's run never stops halfway through publishing.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # The version, its MSI form and the platforms. A job-level `if` cannot
  # read the matrix, so release-matrix.sh turns the input into the include
  # list.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      platforms: ${{ steps.plan.outputs.platforms }}
      version: ${{ steps.version.outputs.version }}
      wix_version: ${{ steps.version.outputs.wix_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      build: ${{ steps.version.outputs.build }}
    steps:
      # The whole history: the build number is the commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The assets job's secrets, named here so a missing one fails before
      # any bundle is built; each bundle job checks its own. Only whether
      # each is set reaches this job, never the secret.
      - name: Check secrets
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' && 'set' || '' }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE != '' && 'set' || '' }}
        run: apps/desktop/scripts/require-secrets.sh LINUX_GPG_PRIVATE_KEY LINUX_GPG_PASSPHRASE

      - id: version
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version" || { echo "::error::no version under [workspace.package] in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the workspace version $version; tag v$version or bump [workspace.package] first"
            exit 1
          fi
          # Before any build: a version WiX cannot take fails here.
          wix_version="$(apps/desktop/scripts/wix-version.sh "$version")"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          build="$(git rev-list --count HEAD)"
          {
            echo "version=$version"
            echo "wix_version=$wix_version"
            echo "prerelease=$prerelease"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version wix_version=$wix_version prerelease=$prerelease build=$build"

      # Sparkle offers an item only above the running build, so the build
      # number must be above every build the `appcast` branch holds (read
      # only here; the `handoff` job writes it). Each tag sits on its own
      # version-bump commit, so no two tags share a count.
      - name: Build number against the appcast branch
        env:
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          git fetch --quiet origin refs/heads/appcast
          git show FETCH_HEAD:appcast.xml > "$RUNNER_TEMP/appcast.xml"
          python3 apps/desktop/scripts/handoff-appcast.py check-build "$RUNNER_TEMP/appcast.xml" "$BUILD"
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos' }}
          MACOS_RUNS_ON: ${{ vars.MACOS_RUNS_ON || '"macos-15"' }}
        run: |
          set -euo pipefail
          matrix="$(apps/desktop/scripts/release-matrix.sh)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "platforms=$(jq -r '.include | map(.name) | join(" ")' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  bundle:
    name: ${{ matrix.name }}
    needs: [plan, deny]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # macOS only (signing-keychain.sh). Outside the workspace and named
      # apart from the Swift release's, which may share the runner.
      KEYCHAIN_PATH: ${{ github.workspace }}/../steno-desktop-release.keychain-db
    steps:
      # The whole history on macOS, whose build number is the commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.name == 'macos' && '0' || '1' }}

      # Before any tool is installed or built: name every missing secret.
      # Of the Sparkle key, only whether it is set reaches this step; the
      # Handoff item step is the only one that sees it.
      - name: Check secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ matrix.name == 'macos' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ matrix.name == 'macos' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          ASC_KEY_ID: ${{ matrix.name == 'macos' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ matrix.name == 'macos' && secrets.ASC_ISSUER_ID || '' }}
          ASC_PRIVATE_KEY: ${{ matrix.name == 'macos' && secrets.ASC_PRIVATE_KEY || '' }}
          SPARKLE_PRIVATE_KEY: ${{ matrix.name == 'macos' && secrets.SPARKLE_PRIVATE_KEY != '' && 'set' || '' }}
        run: |
          set -euo pipefail
          names=(TAURI_SIGNING_PRIVATE_KEY)
          if [ "${{ matrix.name }}" = macos ]; then
            names+=(MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY SPARKLE_PRIVATE_KEY)
          fi
          apps/desktop/scripts/require-secrets.sh "${names[@]}"

      - name: Linux prerequisites
        if: matrix.name == 'linux'
        run: scripts/setup-linux.sh

      - name: Use the installed rustup (self-hosted runners only)
        if: runner.environment == 'self-hosted'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/run/current-system/sw/bin" >> "$GITHUB_PATH"

      # The third-party actions in this job are pinned by commit: the job
      # later hands the signing and notarisation keys to what they install.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      # Keeps the build host's paths out of release panics: the cargo home
      # (the dependency sources) reads `cargo/…`; Cargo already passes the
      # workspace's paths relative, and any absolute one left reads
      # `steno/…`. Set for the job so the sidecar and the app both get it;
      # the encoded form separates flags with 0x1f, so a path with a space
      # stays one flag.
      - name: Remap source paths
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if [ "$RUNNER_OS" = Windows ]; then cargo_home="$(cygpath -aw "$cargo_home")"; fi
          sep=$'\x1f'
          echo "CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=steno$sep--remap-path-prefix=$cargo_home=cargo" >> "$GITHUB_ENV"
          echo "STENO_CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"

      - name: Target directory outside the workspace (self-hosted runners only)
        if: runner.environment == 'self-hosted'
        run: |
          target="$HOME/Library/Caches/steno-ci/$RUNNER_NAME/cargo-target"
          mkdir -p "$target"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          echo "STENO_TARGET_DIR=$target" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `dest` per job: the default `~/setup-pnpm` is shared by every runner
      # on a self-hosted machine, and two concurrent installs collide there.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: apps/macos/web/package.json
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/macos/web/pnpm-lock.yaml

      # The web UI first; Build's config merge drops `beforeBuildCommand` so
      # it is not built twice.
      - name: Web install and build
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/macos/web

      - name: Speech sidecar
        shell: bash
        run: apps/desktop/scripts/stage-sidecar.sh

      # The Tauri CLI as the prebuilt npm package, pinned to the `tauri`
      # crate's version in Cargo.lock. The release binary is built here
      # without any secret in the environment, so no dependency's build
      # script or proc macro sees one; Bundle packages it with the same
      # configuration. tauri.release.conf.json adds the sidecar; on Windows
      # tauri.release.windows.conf.json adds the DirectML.dll it loads, and
      # the plan's MSI version goes in as `bundle.windows.wix.version`; on
      # macOS the plan's build number goes in as `bundle.macOS.bundleVersion`
      # (CFBundleVersion), counted again here from the same commit.
      - name: Build
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          WIX_VERSION: ${{ needs.plan.outputs.wix_version }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          configs=(--config tauri.release.conf.json)
          if [ "${{ matrix.name }}" = windows ]; then
            configs+=(--config tauri.release.windows.conf.json
              --config "{\"bundle\":{\"windows\":{\"wix\":{\"version\":\"$WIX_VERSION\"}}}}")
          fi
          if [ "${{ matrix.name }}" = macos ]; then
            count="$(git rev-list --count HEAD)"
            [ "$count" = "$BUILD" ] || { echo "::error::this checkout counts $count commits, plan counted $BUILD"; exit 1; }
            configs+=(--config "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"$BUILD\"}}}")
          fi
          configs+=(--config '{"build":{"beforeBuildCommand":null}}')
          printf '%s\n' "${configs[@]}" > "$RUNNER_TEMP/tauri-configs"
          pnpm dlx @tauri-apps/cli@2.12.1 build --ci --no-bundle "${configs[@]}"

      # The bundler signs with the identity this prints. The App Store
      # Connect key serves the bundler and notarize-dmg.sh; the last step
      # removes both.
      - name: Signing keychain and notarisation key
        if: matrix.name == 'macos'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          identity="$(apps/desktop/scripts/signing-keychain.sh import "$KEYCHAIN_PATH")"
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077 && printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path")
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "ASC_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      # The binary Build left, signed and packaged with the keys. The CLI
      # pin matters most here, since this step sees them.
      - name: Bundle
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # macOS: the bundler notarises when all three are set (it only
          # warns when one is missing; check-bundle.sh then fails).
          APPLE_API_KEY: ${{ matrix.name == 'macos' && secrets.ASC_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.name == 'macos' && secrets.ASC_ISSUER_ID || '' }}
          APPLE_API_KEY_PATH: ${{ env.ASC_KEY_PATH }}
        run: |
          set -euo pipefail
          configs=()
          while IFS= read -r config; do configs+=("$config"); done < "$RUNNER_TEMP/tauri-configs"
          pnpm dlx @tauri-apps/cli@2.12.1 bundle --ci --bundles "${{ matrix.bundles }}" "${configs[@]}"

      # The image's path stays in STENO_DMG for the Handoff item step.
      - name: Notarise the disk image
        if: matrix.name == 'macos'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmgs=("${STENO_TARGET_DIR:-target}"/release/bundle/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 && -f "${dmgs[0]}" ]] || { echo "::error::expected one .dmg, found ${dmgs[*]}"; exit 1; }
          apps/desktop/scripts/notarize-dmg.sh "${dmgs[0]}"
          echo "STENO_DMG=${dmgs[0]}" >> "$GITHUB_ENV"

      # Also fails when either binary still holds a remapped prefix. On
      # macOS also what the Swift app's last update needs (--handoff).
      - name: Check the bundles
        shell: bash
        env:
          STENO_HOST_PATHS: |
            ${{ github.workspace }}
            ${{ env.STENO_CARGO_HOME }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          signed=()
          if [ "${{ matrix.name }}" = macos ]; then signed=(--signed --handoff "$BUILD"); fi
          apps/desktop/scripts/check-bundle.sh "${signed[@]}" \
            "${STENO_TARGET_DIR:-target}/release/bundle" "${{ matrix.bundles }}"

      # Tag runs only, after the image is notarised and stapled: the EdDSA
      # signature covers its bytes. The one step that sees the Sparkle key.
      # A candidate's item is never published; the first one is what the
      # handoff rehearsal (R2) installs from a local feed.
      - name: Handoff item
        if: matrix.name == 'macos' && github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          apps/desktop/scripts/handoff-item.sh "$VERSION" "$BUILD" "$STENO_DMG" sparkle-item
          cat sparkle-item/appcast.xml

      # Its own artifact, outside the steno-desktop-* pattern `assets`
      # gathers, so the item never becomes a release asset by itself.
      - name: Upload the handoff item
        if: matrix.name == 'macos' && github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-item
          path: sparkle-item/appcast.xml
          if-no-files-found: error

      # A self-hosted runner keeps its target directory outside the
      # workspace; the upload step reads from the workspace.
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          src="${STENO_TARGET_DIR:-target}/release/bundle"
          mkdir -p target/release
          if [ "$src" != "target/release/bundle" ]; then
            rm -rf target/release/bundle
            cp -R "$src" target/release/bundle
          fi
          find target/release/bundle -maxdepth 2 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: steno-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.artifacts }}
            target/release/bundle/**/*.sig
          if-no-files-found: error

      - name: Remove keychain and keys
        if: always() && matrix.name == 'macos'
        run: |
          apps/desktop/scripts/signing-keychain.sh remove "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  # Runs on every run: the release as `publish` would upload it (see the
  # top of this file). The only job that signs with the release signing key.
  assets:
    name: assets
    needs: [plan, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PLATFORMS: ${{ needs.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      # Each artifact in its own directory, dist/steno-desktop-<platform>.
      - uses: actions/download-artifact@v4
        with:
          pattern: steno-desktop-*
          path: dist

      # Each platform's files from its own artifact only, so no other
      # bundle job can put a `.deb` or `.AppImage` up for signing; the
      # macOS archive gets the version in its name.
      - name: Gather the assets
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one argument per platform
          apps/desktop/scripts/release-assets.sh "$VERSION" dist assets $PLATFORMS
          ls -l assets

      # Every signature against the public key the installed apps verify
      # with, so a secret that is not the config key's other half fails
      # here and not on every user's next update. Two updater artifacts per
      # platform on Linux and Windows, one on macOS.
      - name: Verify the updater signatures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign >/dev/null
          pubkey="$(jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json | base64 --decode)"
          printf '%s\n' "$pubkey" > "$RUNNER_TEMP/updater.pub"
          expected=0
          for platform in $PLATFORMS; do
            case "$platform" in macos) expected=$((expected + 1)) ;; *) expected=$((expected + 2)) ;; esac
          done
          count=0
          for sig in assets/*.sig; do
            base64 --decode "$sig" > "$RUNNER_TEMP/signature.minisig"
            asset="${sig#assets/}"
            minisign -V -q -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/signature.minisig" -m "${sig%.sig}" \
              || { echo "::error::$asset does not verify ${asset%.sig} against plugins.updater.pubkey"; exit 1; }
            count=$((count + 1))
          done
          test "$count" -eq "$expected" || { echo "::error::expected $expected updater signatures for $PLATFORMS, found $count"; exit 1; }
          echo "verified $count updater signatures"

      # The URLs name the tag a release of this version is published under,
      # on a manual run too.
      - name: Updater manifest
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one argument per platform
          apps/desktop/scripts/updater-manifest.sh "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" assets $PLATFORMS \
            > assets/latest.json
          cat assets/latest.json

      # Last, so the checksums cover latest.json too. Fails the run when a
      # signature does not verify against the committed public key. The
      # script's log (which files it signed and verified, the fingerprint)
      # is a manual run's proof.
      - name: Checksums and signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          apps/desktop/scripts/release-signatures.sh assets apps/desktop/release-signing-key.asc 2>&1 \
            | tee "$RUNNER_TEMP/signatures.txt"
          cat assets/SHA256SUMS

      # The notes publish will write, in the run's summary.
      - name: Release notes
        run: |
          set -euo pipefail
          apps/desktop/scripts/release-notes.sh "$VERSION" "v$VERSION" assets \
            apps/desktop/release-signing-key.asc >> "$GITHUB_STEP_SUMMARY"

      # Kept a few days, so a failed publish can be re-run
      # (apps/desktop/README.md, When a run fails).
      - name: Upload the release assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 5
          overwrite: true

      # A manual run's proof, without the signatures: each would be a valid
      # one on a build that is never published.
      - name: Checksums and what was verified
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          mkdir -p checksums
          cp assets/SHA256SUMS "$RUNNER_TEMP/signatures.txt" checksums/
      - name: Upload the checksums
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-checksums
          path: checksums/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # Only a pushed tag publishes, one run at a time, so two tags never write
  # the lanes at once.
  publish:
    name: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [plan, assets]
    concurrency:
      group: desktop-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents for the release, the lanes and the AUR bump's branch;
    # pull-requests for the AUR bump's pull request.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      handoff_item: ${{ steps.appcast.outputs.handoff_item }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-assets
          path: assets

      # A stable release carries the `appcast` branch's feed as its
      # `appcast.xml`: the first Swift release reads the feed through
      # `releases/latest`. Whether the branch already has the handoff item
      # (an item without a channel) decides whether `handoff` runs.
      - name: Appcast from the branch
        id: appcast
        if: needs.plan.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          git fetch --quiet origin refs/heads/appcast
          mkdir -p "$RUNNER_TEMP/feed"
          git show FETCH_HEAD:appcast.xml > "$RUNNER_TEMP/feed/appcast.xml"
          handoff_item="$(python3 apps/desktop/scripts/handoff-appcast.py has-handoff-item "$RUNNER_TEMP/feed/appcast.xml")"
          echo "handoff_item=$handoff_item" >> "$GITHUB_OUTPUT"
          echo "the appcast branch has the handoff item: $handoff_item"

      # The notes say how to check a download against the signatures the
      # assets job made (release-notes.sh). A candidate stays a pre-release
      # and never "latest"; a stable release becomes "latest" with its
      # appcast.xml already uploaded, so `releases/latest` never lacks it.
      - name: Publish the release
        run: |
          set -euo pipefail
          apps/desktop/scripts/release-notes.sh "$VERSION" "$TAG" assets apps/desktop/release-signing-key.asc \
            > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing assets"
          else
            gh release create "$TAG" --draft --prerelease --latest=false \
              --verify-tag --title "Steno $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" assets/* --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release upload "$TAG" "$RUNNER_TEMP/feed/appcast.xml" --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$TAG" --json url --jq .url

      # After the release is public, so the manifest's URLs resolve. Each
      # lane is a release holding only latest.json, its tag on the commit of
      # the version it serves; updater-lanes.sh decides which lanes move. A
      # lane that does not exist yet (404) is created; any other failure to
      # read one stops the step.
      - name: Update lanes
        run: |
          set -euo pipefail
          # serving <lane>: the version its latest.json serves, empty if none.
          serving() {
            local code
            code="$(curl -sSL --retry 3 -o "$RUNNER_TEMP/$1.json" -w '%{http_code}' \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$1/latest.json")" \
              || { echo "::error::could not read the $1 manifest" >&2; return 1; }
            case "$code" in
              404) return 0 ;;
              200) ;;
              *) echo "::error::reading the $1 manifest gave HTTP $code" >&2; return 1 ;;
            esac
            jq -er '.version // empty' "$RUNNER_TEMP/$1.json" \
              || { echo "::error::the $1 manifest names no version" >&2; return 1; }
          }
          beta="$(serving desktop-beta)"
          stable="$(serving desktop-stable)"
          moving="$(apps/desktop/scripts/updater-lanes.sh "$VERSION" "$beta" "$stable")"
          [ -n "$moving" ] || { echo "no lane moves to $VERSION"; exit 0; }
          while IFS= read -r lane; do
            notes="The updater manifest of the ${lane#desktop-} lane: Steno $VERSION ($TAG). Installed desktop apps read latest.json from here; the installers are on $TAG."
            if gh release view "$lane" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$lane" -f sha="$GITHUB_SHA" -F force=true >/dev/null
              gh release edit "$lane" --notes "$notes" --prerelease --latest=false
            else
              gh release create "$lane" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "Steno desktop updates (${lane#desktop-})" --notes "$notes"
            fi
            gh release upload "$lane" assets/latest.json --clobber
            echo "$lane serves $VERSION"
          done <<< "$moving"

      # Stable releases only (D7): Casks/steno.rb in NicolaiSchmid/homebrew-tap
      # follows the release just published. Without HOMEBREW_TAP_TOKEN the
      # script prints a notice and exits 0; the first stable bump is a tap
      # commit by hand. A failed push is a warning on a release that
      # already stands.
      - name: Bump the Homebrew cask
        if: needs.plan.outputs.prerelease == 'false'
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: apps/macos/scripts/bump-homebrew-cask.sh "$VERSION" "assets/Steno_${VERSION}_aarch64.dmg"

      # Stable releases only: the AUR package `steno-desktop-bin` follows
      # (aur-bump.sh), and a pull request carries the same bump into
      # packaging/aur. Without AUR_SSH_PRIVATE_KEY a notice; the first push
      # is by hand. A failure is a warning on a release that already stands.
      - name: Push the AUR bump
        if: needs.plan.outputs.prerelease == 'false'
        continue-on-error: true
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; steno-desktop-bin on the AUR stays where it is (packaging/aur/README.md, Push to the AUR)."
            exit 0
          fi
          apps/desktop/scripts/aur-bump.sh "$VERSION" assets
          branch="chore/aur-$VERSION"
          git switch --quiet -c "$branch"
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "chore(desktop): steno-desktop-bin $VERSION-1, as pushed to the AUR"
          git push --quiet origin "HEAD:refs/heads/$branch"
          gh api "repos/$GITHUB_REPOSITORY/pulls" -f title="chore(desktop): steno-desktop-bin $VERSION-1" \
            -f head="$branch" -f base=main \
            -f body="The AUR bump the release workflow pushed for $TAG (apps/desktop/scripts/aur-bump.sh), so packaging/aur follows the AUR." \
            --jq .html_url

      # Stable releases only: the two lines flake.nix's `release` attrset
      # needs, for a bump pull request by hand.
      - name: Nix flake lines in the summary
        if: needs.plan.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          dmg="assets/Steno_${VERSION}_aarch64.dmg"
          test -f "$dmg"
          sri="sha256-$(openssl dgst -sha256 -binary "$dmg" | base64)"
          {
            echo "## Nix flake bump"
            echo
            echo "Paste into the \`release\` attrset at the top of \`flake.nix\`:"
            echo
            echo '```nix'
            echo "version = \"$VERSION\";"
            echo "hash = \"$sri\";"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION hash=$sri"

  # The Sparkle handoff (stable plan D8): the handoff item goes on the
  # `appcast` branch, which every Swift build since v0.9.0-rc.2 reads, and
  # the branch's feed becomes the release's appcast.xml for v0.9.0-rc.1.
  # Stable tags only, behind the `appcast` environment, whose required
  # reviewer approves after the stable build's rehearsal (R7). Skipped
  # without asking once the branch has its item, unless the repository
  # variable HANDOFF_ITEM_REPLACE names this version: a release that fixes
  # the handoff itself.
  handoff:
    name: handoff
    needs: [plan, publish]
    if: >-
      needs.plan.outputs.prerelease == 'false' &&
      (needs.publish.outputs.handoff_item == 'false' || vars.HANDOFF_ITEM_REPLACE == needs.plan.outputs.version)
    environment: appcast
    concurrency:
      group: desktop-handoff
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sparkle-item
          path: sparkle-item

      # The approval's time: Sparkle counts the rollout's groups from the
      # item's pubDate, and the job starts when the reviewer approves. A
      # re-run after the item reached the branch keeps the branch's item,
      # and so its date, and only uploads the feed again.
      - name: Date the item
        id: date
        run: |
          set -euo pipefail
          git fetch --quiet origin refs/heads/appcast
          git show FETCH_HEAD:appcast.xml > "$RUNNER_TEMP/branch.xml"
          on_branch="$(python3 apps/desktop/scripts/handoff-appcast.py has-build "$RUNNER_TEMP/branch.xml" "$BUILD")"
          echo "on_branch=$on_branch" >> "$GITHUB_OUTPUT"
          if [ "$on_branch" = true ]; then
            echo "::notice::build $BUILD is on the appcast branch already; its item and date stay"
          else
            python3 apps/desktop/scripts/handoff-appcast.py stamp-pubdate sparkle-item/appcast.xml "$(date +%s)"
          fi

      - name: Put the item on the appcast branch
        if: steps.date.outputs.on_branch == 'false'
        env:
          STENO_RELEASE_APPCAST: ${{ github.workspace }}/sparkle-item/appcast.xml
        run: apps/macos/scripts/publish-appcast.sh "$TAG" false

      - name: The branch's feed as the release's appcast.xml
        run: |
          set -euo pipefail
          git fetch --quiet origin refs/heads/appcast
          mkdir -p "$RUNNER_TEMP/feed"
          git show FETCH_HEAD:appcast.xml > "$RUNNER_TEMP/feed/appcast.xml"
          gh release upload "$TAG" "$RUNNER_TEMP/feed/appcast.xml" --clobber
          grep -c '<item>' "$RUNNER_TEMP/feed/appcast.xml"
