# The flake (flake.nix, nix/): every output evaluates on both systems, the
# web UI's pnpm hash matches its lockfile, and the Linux package and its
# checks build (X7 of .plans/2026-10-07-stable-promotion.md). A pull request
# runs it when the flake, the web UI's dependencies, a Cargo manifest, the
# lockfile, a build script, the Tauri configuration, the sidecar staging or
# the release's Tauri CLI pin changes: what can break the Nix build alone.
# Main also runs it after any change to what the package builds, so a tag
# never finds the package broken first.
name: Nix CI

on:
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'apps/macos/web/package.json'
      - 'apps/macos/web/pnpm-lock.yaml'
      - 'apps/macos/web/pnpm-workspace.yaml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/build.rs'
      - 'apps/desktop/src-tauri/tauri*.json'
      - 'apps/desktop/scripts/stage-sidecar.sh'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/nix-ci.yml'
  push:
    branches: ['main']
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'apps/macos/web/**'
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Sources/StenoCore/Resources/**'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/nix-ci.yml'
  workflow_dispatch:

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Flake (x86_64-linux package and module)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Evaluate every output
        run: nix flake check --no-build --all-systems

      # Fails within a minute and prints the `got:` hash for nix/package.nix
      # when the web UI's lockfile moved without it.
      - name: Web UI dependencies against their hash
        run: nix build --no-link -L .#steno.pnpmDeps

      - name: Package and checks
        run: nix build --no-link -L .#checks.x86_64-linux.package .#checks.x86_64-linux.module
