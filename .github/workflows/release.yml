name: Release macOS app

# Tag `v*` (or a manual dry run): import the Developer ID certificate into
# a throwaway keychain, generate the project, archive and export with
# Developer ID and hardened runtime, verify the signature and entitlements,
# build the DMG, notarise and staple it, generate the Sparkle appcast from
# SPARKLE_PRIVATE_KEY, and publish a GitHub release with both assets (a
# pre-release when the tag carries a hyphen, so `releases/latest` skips it).
#
# Runs on the Forge runner when `MACOS_RUNS_ON` names it, on GitHub-hosted
# `macos-15` otherwise. Secrets that do not exist yet make the workflow fail
# in its first step with a clear message instead of a cryptic codesign error.
# The keychain and the App Store Connect key are removed in `always()` steps.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, sign and verify; no notarisation, no release'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  KEYCHAIN_PATH: ${{ github.workspace }}/../steno-release.keychain-db

jobs:
  release:
    name: Build, notarise, publish
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '"macos-15"') }}
    timeout-minutes: 90
    steps:
      - name: Check secrets
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          missing=()
          [ -n "$P12" ] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [ -n "$P12_PASSWORD" ] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          if [ "$DRY_RUN" != "true" ]; then
            [ -n "$ASC_KEY_ID" ] || missing+=(ASC_KEY_ID)
            [ -n "$ASC_ISSUER_ID" ] || missing+=(ASC_ISSUER_ID)
            [ -n "$ASC_PRIVATE_KEY" ] || missing+=(ASC_PRIVATE_KEY)
            [ -n "$SPARKLE_PRIVATE_KEY" ] || missing+=(SPARKLE_PRIVATE_KEY)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing repository secrets: ${missing[*]}. Create the Developer ID Application certificate, export it as .p12, base64-encode it into MACOS_CERTIFICATE_P12_BASE64 and put its password in MACOS_CERTIFICATE_PASSWORD (apps/macos/README.md, 'One-time setup')."
            exit 1
          fi
          echo "all release secrets present (dry run: $DRY_RUN)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: '16.4'

      - name: Install xcodegen
        run: apps/macos/scripts/install-xcodegen.sh

      - name: Versions from the tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v0.0.0-dryrun.$(git rev-list --count HEAD)"
          fi
          version="${tag#v}"
          build="$(git rev-list --count HEAD)"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version build=$build prerelease=$prerelease"

      # Temporary keychain per run on both runner kinds; nothing release
      # related is pre-installed anywhere. The partition list lets codesign
      # use the key without a UI prompt.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 24)"
          cert_path="$RUNNER_TEMP/steno-release.p12"
          echo "$P12" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$cert_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$cert_path"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application' \
            || { echo "::error::the imported certificate is not a Developer ID Application identity"; exit 1; }

      - name: Archive, export, verify
        run: apps/macos/scripts/build-release.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"

      - name: DMG (dry run, unsigned by Apple)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: apps/macos/scripts/make-dmg.sh "${{ steps.version.outputs.version }}" --skip-notarization

      - name: DMG, notarise, staple
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: apps/macos/scripts/make-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Appcast
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: apps/macos/scripts/make-appcast.sh "${{ steps.version.outputs.tag }}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steno-macos-${{ steps.version.outputs.version }}
          path: |
            apps/macos/dist/*.dmg
            apps/macos/dist/appcast.xml
            apps/macos/dist/*.log
            apps/macos/dist/notarization.json
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          dmg="apps/macos/dist/Steno-$VERSION.dmg"
          appcast="apps/macos/dist/appcast.xml"
          test -f "$dmg" && test -f "$appcast"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing assets"
          else
            gh release create "$TAG" --draft --generate-notes --title "Steno $VERSION"
          fi
          gh release upload "$TAG" "$dmg" "$appcast" --clobber
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json url --jq .url

      - name: Remove keychain and keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security list-keychain -d user -s login.keychain-db 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/steno-release.p12
