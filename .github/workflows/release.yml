name: Release macOS app

# Tag `v*` (or a manual dry run): import the Developer ID certificate into
# a throwaway keychain, generate the project, archive and export with
# Developer ID and hardened runtime, verify the signature and entitlements,
# build the DMG, notarise and staple it, generate the Sparkle appcast from
# SPARKLE_PRIVATE_KEY, publish a GitHub release with both assets (a
# pre-release when the tag carries a hyphen), fold the item into the rolling
# appcast on the `appcast` branch (the feed every installed build reads) and
# bump the Homebrew cask in NicolaiSchmid/homebrew-tap when
# HOMEBREW_TAP_TOKEN exists.
#
# Runs on the Forge runner when `MACOS_RUNS_ON` names it, on GitHub-hosted
# `macos-15` otherwise. Secrets that do not exist yet make the workflow fail
# in its first step with a clear message instead of a cryptic codesign error.
# The keychain and the App Store Connect key are removed in `always()` steps.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, sign and verify; no notarisation, no release'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  KEYCHAIN_PATH: ${{ github.workspace }}/../steno-release.keychain-db

jobs:
  release:
    name: Build, notarise, publish
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '"macos-15"') }}
    timeout-minutes: 90
    env:
      STENO_WEB_PREBUILT: "1"
      # One place decides what a dry run is; every conditional step reads it.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First thing after checkout, before any tool is installed or built:
      # the guard names every missing secret. The script is unit-tested in
      # StenoTests (ReleaseScriptsTests) against /bin/bash.
      - name: Check secrets
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: apps/macos/scripts/check-release-secrets.sh

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: '16.4'

      - name: Install xcodegen
        run: apps/macos/scripts/install-xcodegen.sh

      # The publish step needs `gh`. Hosted images ship it; Forge does not,
      # and the first tag built there (v0.9.0-rc.2) notarised fine and then
      # died on `gh: command not found`. Installed before the build so a
      # broken download fails in seconds, not after twenty minutes of Xcode.
      - name: Install gh
        run: apps/macos/scripts/install-gh.sh

      - name: Versions from the tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v0.0.0-dryrun.$(git rev-list --count HEAD)"
          fi
          version="${tag#v}"
          build="$(git rev-list --count HEAD)"
          # The build number is the commit count, so two tags on one commit
          # share it and Sparkle (which orders by build number alone) would
          # never offer the second to installs of the first. Promote a
          # candidate by tagging a new commit, not the same one.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            other="$(git tag --points-at HEAD 'v*' | grep -vx "$tag" || true)"
            if [ -n "$other" ]; then
              echo "::error::$tag shares its commit (build $build) with $other; tag a new commit instead"
              exit 1
            fi
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version build=$build prerelease=$prerelease"

      # Temporary keychain per run on both runner kinds; nothing release
      # related is pre-installed anywhere. The partition list lets codesign
      # use the key without a UI prompt.
      # The web UI is built here with pnpm so the Xcode pre-build phase only
      # copies dist/ into the bundle (scripts/build-web.sh).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/macos/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/macos/web/pnpm-lock.yaml

      - name: Build web UI
        run: |
          pnpm --dir apps/macos/web install --frozen-lockfile
          pnpm --dir apps/macos/web build

      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 24)"
          cert_path="$RUNNER_TEMP/steno-release.p12"
          echo "$P12" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$cert_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
          # Put the throwaway keychain in front of the search list as it is
          # (on Forge it may hold more than the login keychain).
          before=()
          while IFS= read -r line; do [ -n "$line" ] && before+=("$line"); done \
            < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${before[@]}"
          rm -f "$cert_path"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application' \
            || { echo "::error::the imported certificate is not a Developer ID Application identity"; exit 1; }

      - name: Archive, export, verify
        run: apps/macos/scripts/build-release.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"

      - name: DMG (dry run, unsigned by Apple)
        if: env.DRY_RUN == 'true'
        run: apps/macos/scripts/make-dmg.sh "${{ steps.version.outputs.version }}" --skip-notarization

      - name: DMG, notarise, staple
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: apps/macos/scripts/make-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Appcast
        if: env.DRY_RUN != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: apps/macos/scripts/make-appcast.sh "${{ steps.version.outputs.tag }}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steno-macos-${{ steps.version.outputs.version }}
          path: |
            apps/macos/dist/*.dmg
            apps/macos/dist/appcast.xml
            apps/macos/dist/*.log
            apps/macos/dist/notarization.json
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          dmg="apps/macos/dist/Steno-$VERSION.dmg"
          appcast="apps/macos/dist/appcast.xml"
          test -f "$dmg" && test -f "$appcast"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing assets"
          else
            gh release create "$TAG" --draft --generate-notes --title "Steno $VERSION"
          fi
          gh release upload "$TAG" "$dmg" "$appcast" --clobber
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json url --jq .url

      # Fold this release's item into the rolling appcast every installed
      # build reads (.plans/2026-09-28-settings-redesign.md, Decision 9).
      # After the release is public, so the enclosure URL resolves; a
      # pre-release lands on the `beta` channel.
      - name: Rolling appcast
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: apps/macos/scripts/publish-appcast.sh "$TAG" "$PRERELEASE"

      # Point Casks/steno.rb in NicolaiSchmid/homebrew-tap at the DMG just
      # published. Pre-releases bump too (release candidates are tested
      # through brew); Sparkle follows the rolling appcast above.
      # Without HOMEBREW_TAP_TOKEN the script prints a notice and exits 0;
      # with it, a failed push is a warning on a release that already stands.
      - name: Bump Homebrew cask
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: apps/macos/scripts/bump-homebrew-cask.sh "$VERSION" "apps/macos/dist/Steno-$VERSION.dmg"

      # The two lines the Nix flake needs for this release; a human copies
      # them into the `release` attrset at the top of flake.nix. Automating
      # the bump is a follow-up.
      - name: Nix flake bump in the job summary
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg="apps/macos/dist/Steno-$VERSION.dmg"
          test -f "$dmg"
          sri="sha256-$(shasum -a 256 "$dmg" | cut -d' ' -f1 | xxd -r -p | base64)"
          {
            echo "## Nix flake bump"
            echo
            echo "Paste into the \`release\` attrset at the top of \`flake.nix\`:"
            echo
            echo '```nix'
            echo "version = \"$VERSION\";"
            echo "hash = \"$sri\";"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION hash=$sri"

      - name: Remove keychain and keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          # delete-keychain also takes it off the search list. If an entry is
          # left, drop only it from the list as it is now: on Forge another
          # release run's keychain or the user's own may be on it. The list
          # holds the resolved path (no `..`).
          keychain="$(cd "$(dirname "$KEYCHAIN_PATH")" && pwd -P)/$(basename "$KEYCHAIN_PATH")"
          others=()
          listed=false
          while IFS= read -r line; do
            if [ "$line" = "$keychain" ]; then listed=true; elif [ -n "$line" ]; then others+=("$line"); fi
          done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          if [ "$listed" = true ]; then
            security list-keychains -d user -s ${others[@]+"${others[@]}"} 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/steno-release.p12
