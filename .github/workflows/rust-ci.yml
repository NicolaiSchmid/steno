# TEMPORARY smoke bisect workflow (tmp/smoke-bisect-*): only the Linux steps
# the close-without-tray smoke needs. Never merged.
name: Rust CI

on:
  pull_request:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: linux
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Linux prerequisites
        run: scripts/setup-linux.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: apps/macos/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/macos/web/pnpm-lock.yaml
      - name: Web install and build
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/macos/web
      - name: Desktop build
        env:
          TAURI_CONFIG: '{"build":{"devUrl":null}}'
        run: cargo build -p steno-desktop --locked
      - name: Desktop close without a tray
        timeout-minutes: 5
        run: |
          mkdir -p apps/desktop/screens
          scripts/pipewire-headless.sh \
            apps/desktop/scripts/close-without-tray-linux.sh target/debug/steno-desktop
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: close-screens
          path: apps/desktop/screens
          if-no-files-found: ignore
