name: Speech fixtures (one-off)

# Temporary: generates the `say` fixtures for Tests/Fixtures/speech on a
# macOS runner and uploads them as an artifact, because the speech
# workstream's agent has no Mac. The WAVs are committed once with their
# .ref.txt and this workflow is removed in the same PR.

on:
  pull_request:
    paths:
      - '.github/workflows/speech-fixtures.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Voices
        run: say -v '?' | grep -E 'de_DE|en_US' || true

      - name: Generate
        run: |
          set -euo pipefail
          mkdir -p out
          de="$(say -v '?' | awk '/de_DE/ {print $1; exit}')"
          en="$(say -v '?' | awk '/en_US/ {print $1; exit}')"
          say -v '?' | grep -q '^Anna ' && de=Anna
          say -v '?' | grep -q '^Samantha ' && en=Samantha
          echo "german voice: $de, english voice: $en"
          gen() { # voice, name, text
            say -v "$1" -o "out/$2.wav" --data-format=LEI16@16000 "$3"
            printf '%s\n' "$3" > "out/$2.ref.txt"
          }
          gen "$de" de-short "Wir besprechen morgen die Produktstrategie mit dem ganzen Team."
          gen "$de" de-short-2 "Die Kundin hat den Vertrag gestern Abend unterschrieben."
          gen "$en" en-short "Let us review the onboarding numbers before the customer call."
          gen "$de" denglish "Wir müssen das Onboarding Dashboard noch vor dem Release testen."
          a1="Guten Morgen, wie geht es dir?"; s1="I am doing well, thank you."
          a2="Sollen wir mit dem Meeting anfangen?"; s2="Yes, let us start right away."
          say -v "$de" -o out/t1.wav --data-format=LEI16@16000 "$a1"
          say -v "$en" -o out/t2.wav --data-format=LEI16@16000 "$s1"
          say -v "$de" -o out/t3.wav --data-format=LEI16@16000 "$a2"
          say -v "$en" -o out/t4.wav --data-format=LEI16@16000 "$s2"
          python3 - <<'PY'
          import wave
          frames = []
          silence = b"\x00\x00" * int(16000 * 0.4)
          for name in ["t1", "t2", "t3", "t4"]:
              with wave.open(f"out/{name}.wav", "rb") as w:
                  assert w.getframerate() == 16000 and w.getnchannels() == 1 and w.getsampwidth() == 2, name
                  frames.append(w.readframes(w.getnframes()))
          with wave.open("out/two-speakers.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(silence.join(frames))
          PY
          printf '%s %s %s %s\n' "$a1" "$s1" "$a2" "$s2" > out/two-speakers.ref.txt
          rm out/t?.wav
          for f in out/*.wav; do
            python3 -c "import wave,sys; w=wave.open(sys.argv[1]); print(sys.argv[1], w.getframerate(), w.getnchannels(), w.getsampwidth()*8, round(w.getnframes()/w.getframerate(),2), 's')" "$f"
          done
          (cd out && shasum -a 256 *.wav *.ref.txt | tee MANIFEST.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: speech-fixtures
          path: out/
          if-no-files-found: error
