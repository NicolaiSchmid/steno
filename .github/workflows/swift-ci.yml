name: Swift CI

# Builds, lints and tests the Swift package and the macOS app. `package` and
# `app` run on the Forge runners when `MACOS_RUNS_ON` points there, otherwise
# on the GitHub-hosted macOS image; `ui-smoke` always runs hosted. Path-gated
# so it does nothing for unrelated changes.
#
# What every run reports (see `.plans/2026-09-25-v1-program.md`, verification
# standard): `swift format lint --strict`, `swift test --parallel
# --xunit-output`, a step summary with totals and every skipped test's name and
# message, and a failure when a skip message names none of the `STENO_*`
# opt-in switches.
#
# Build directories and caching, two regimes:
#
#   • Self-hosted (Forge). The build directories live outside the workspace,
#     under `~/Library/Caches/steno-ci/<runner name>/`, which checkout's clean
#     never touches, so every run starts from the previous run's incremental
#     state on the same runner and nothing is uploaded. `actions/cache` was
#     the bottleneck there: measured on 2026-09-28, saving the 1.2 to 1.4 GB
#     `.build` or DerivedData from Forge ran at 1.3 MB/s and took 15 to 18
#     minutes per job against a 2-minute cold build. Per runner because
#     SwiftPM and Xcode write absolute paths into their state. A manual run
#     with `clean_build_dirs` wipes the directories when stale state is
#     suspected.
#
#   • GitHub-hosted. Fresh machine every run, so the compiled dependencies
#     come from `actions/cache`, restored in every run and saved only by
#     pushes to `main`. PR runs never save: a save per PR commit (the old
#     scheme, keyed on a source hash) filled the 10 GB repository cache with
#     one 1.1 GB entry per commit within a day, and GitHub then evicted the
#     `main` entries every other PR needed. The key ends in the commit SHA so
#     each merge to `main` refreshes the entry and PRs restore the newest one
#     through the dependency-hash prefix.
#
# Sixty minutes for the package because FluidAudio and WhisperKit compile
# cold in 15 to 25 minutes on the hosted image.

on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'apps/macos/**'
      - 'scripts/build-web.sh'
      - '.github/workflows/swift-ci.yml'
  push:
    branches: ['main']
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'apps/macos/**'
      - 'scripts/build-web.sh'
      - '.github/workflows/swift-ci.yml'
  workflow_dispatch:
    inputs:
      clean_build_dirs:
        description: 'Delete the persistent build directories on the self-hosted runner before building'
        type: boolean
        default: false

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Build and test package
    # MACOS_RUNS_ON holds a JSON value: the string "macos-15" today, a label
    # array such as ["self-hosted","macOS","ARM64"] once the Forge runner is
    # registered. fromJSON turns either into a runner label.
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '"macos-15"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest-stable`: the toolchain decides how `swift format`
      # lays code out and which Swift Testing / xunit shape we parse below.
      # Xcode 16.4 is Swift 6.1, the version GRDB 7.11 requires.
      # Hosted runners only: the self-hosted Forge runner ships one Xcode and
      # no 16.4, so there we rely on the preinstalled toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: '16.4'

      - name: Swift version
        id: swift
        run: |
          swift --version
          version="$(swift --version 2>&1 | head -n 1 | tr -c 'A-Za-z0-9.\n' '-')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Where SwiftPM builds. On a self-hosted Forge runner the scratch path
      # lives outside the workspace, under the runner's own directory in
      # ~/Library/Caches, so it survives `actions/checkout`'s clean and the
      # next run starts warm without actions/cache at all. actions/cache was
      # the bottleneck there: every push misses the exact key and the save at
      # the end tarred and uploaded ~1.2 GB for 15 to 18 minutes, four to
      # five times longer than the build and tests themselves. The path is
      # per runner because SwiftPM writes absolute paths into
      # `.build/workspace-state.json` (binary artifacts such as FluidAudio's
      # NemoTextProcessing.xcframework); a `.build` from one runner does not
      # build on another. Hosted runners keep `.build` in the workspace and
      # restore it from actions/cache as before.
      - name: Build location
        env:
          CLEAN: ${{ inputs.clean_build_dirs }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            scratch="$HOME/Library/Caches/steno-ci/$RUNNER_NAME/swiftpm"
            if [ "$CLEAN" = "true" ]; then
              echo "clean_build_dirs: removing $scratch"
              rm -rf "$scratch"
            fi
          else
            scratch="$GITHUB_WORKSPACE/.build"
          fi
          mkdir -p "$scratch"
          du -sh "$scratch"
          echo "SWIFT_SCRATCH=$scratch" >> "$GITHUB_ENV"
          echo "scratch path: $scratch"

      - name: Restore .build (hosted runners only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-hosted-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-build-${{ runner.os }}-hosted-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swift-build-${{ runner.os }}-hosted-${{ steps.swift.outputs.version }}-

      - name: Lint formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift

      # No index store: CI never reads it and it is a large share of `.build`.
      - name: Build
        run: swift build --build-tests --scratch-path "$SWIFT_SCRATCH" --disable-index-store

      # The reports live outside the cached `.build`, so a run whose test step
      # dies before writing can never summarise an earlier run's XML.
      - name: Test
        id: test
        run: |
          rm -rf test-results && mkdir -p test-results
          swift test --parallel --skip-build --scratch-path "$SWIFT_SCRATCH" --xunit-output test-results/junit.xml

      # `--xunit-output` writes XCTest results to junit.xml and Swift Testing
      # results to junit-swift-testing.xml (a `<skipped>` element carries the
      # skip comment). Totals and every skip land in the step summary; a skip
      # whose message names no `STENO_*` opt-in switch fails the job, so an
      # accidental skip cannot hide.
      - name: Test summary
        if: success() || steps.test.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("test-results/junit*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          skipped, failed = [], []
          for path in files:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else root.iter("testsuite")
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.get(key, "0") or 0)
              for case in root.iter("testcase"):
                  name = f'{case.get("classname", "")}/{case.get("name", "")}'
                  skip = case.find("skipped")
                  if skip is not None:
                      message = (skip.get("message") or skip.text or "").strip()
                      skipped.append((name, message))
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append(name)

          lines = ["## Swift tests", ""]
          if not files:
              lines.append("No xunit output found under `test-results/junit*.xml`.")
          lines.append("| Tests | Failures | Errors | Skipped |")
          lines.append("|---|---|---|---|")
          lines.append(f'| {totals["tests"]} | {totals["failures"]} | {totals["errors"]} | {totals["skipped"]} |')
          lines.append("")
          if failed:
              lines.append("### Failed")
              lines.extend(f"- `{name}`" for name in failed)
              lines.append("")
          if skipped:
              lines.append("### Skipped")
              lines.extend(f"- `{name}`: {message or '(no message)'}" for name, message in skipped)
              lines.append("")
          for source in files:
              lines.append(f"Source: `{source}`")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(summary)

          bad = [name for name, message in skipped if "STENO_" not in message]
          if bad:
              print("::error::skipped tests whose message names no STENO_* opt-in switch: " + ", ".join(bad))
              sys.exit(1)
          if not files:
              print("::error::no xunit output was produced")
              sys.exit(1)
          PY

      # A golden mismatch writes the actual bytes beside the golden as
      # `<name>.actual` (see StenoCore/Testing/Snapshot.swift); uploading them
      # lets a developer without a Mac inspect or adopt the runner's output.
      # The junit files must exist, so a missing upload fails the job instead
      # of passing silently.
      - name: Upload xunit output and snapshot mismatches
        if: success() || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-results/junit*.xml
            Tests/Fixtures/**/*.actual
          if-no-files-found: error

      # Only pushes to `main` publish a cache entry; see the header.
      - name: Save .build (hosted runners, main only)
        if: runner.environment == 'github-hosted' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-hosted-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}

  # The macOS app: xcodegen generates the project (git-ignored), xcodebuild
  # compiles the app against the local package and Sparkle with an ad-hoc
  # signature (Debug: hardened runtime off, so no certificate is needed),
  # then the hostless unit tests and the UI smoke test run separately so a
  # UI-automation failure on the hosted runner (spike S1) is attributable.
  # Runs beside `package`, not after it, so a lint failure there never hides
  # an app build failure and the two long builds overlap. DerivedData is
  # cached so FluidAudio and WhisperKit compile once per dependency change.
  app:
    name: Build and test macOS app
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '"macos-15"') }}
    timeout-minutes: 90
    env:
      # The DerivedData path is passed per xcodebuild call from $DERIVED_DATA;
      # the "Build location" step below decides it per runner kind.
      XCODEBUILD_FLAGS: >-
        -project apps/macos/Steno.xcodeproj
        -configuration Debug
        -destination platform=macOS,arch=arm64
        -skipPackagePluginValidation
        -skipMacroValidation
        CODE_SIGN_IDENTITY=-
        CODE_SIGN_STYLE=Manual
        DEVELOPMENT_TEAM=
        COMPILER_INDEX_STORE_ENABLE=NO
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: '16.4'

      - name: Swift version
        id: swift
        run: |
          swift --version
          version="$(swift --version 2>&1 | head -n 1 | tr -c 'A-Za-z0-9.\n' '-')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install xcodegen
        run: apps/macos/scripts/install-xcodegen.sh

      # Where xcodebuild keeps DerivedData. Same reasoning as the package
      # job's "Build location": on a self-hosted Forge runner it lives under
      # the runner's own ~/Library/Caches directory, survives the checkout
      # clean, and is never tarred for actions/cache (the save alone took 9
      # to 18 minutes per run against a 3-minute build). DerivedData holds
      # absolute paths (SourcePackages checkouts, the build database), so it
      # is per runner. Hosted runners keep it in the workspace and use
      # actions/cache.
      - name: Build location
        env:
          CLEAN: ${{ inputs.clean_build_dirs }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            derived="$HOME/Library/Caches/steno-ci/$RUNNER_NAME/DerivedData"
            if [ "$CLEAN" = "true" ]; then
              echo "clean_build_dirs: removing $derived"
              rm -rf "$derived"
            fi
          else
            derived="$GITHUB_WORKSPACE/apps/macos/build/DerivedData"
          fi
          mkdir -p "$derived"
          du -sh "$derived"
          echo "DERIVED_DATA=$derived" >> "$GITHUB_ENV"
          echo "DerivedData: $derived"

      - name: Restore DerivedData (hosted runners only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/macos/build/DerivedData/SourcePackages
            apps/macos/build/DerivedData/Build
          key: steno-app-${{ runner.os }}-hosted-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/macos/project.yml', 'Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            steno-app-${{ runner.os }}-hosted-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/macos/project.yml', 'Package.swift', 'Package.resolved') }}-
            steno-app-${{ runner.os }}-hosted-${{ steps.swift.outputs.version }}-

      # The web UI is built here with pnpm so the Xcode pre-build phase only
      # copies dist/ into the bundle (scripts/build-web.sh).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/macos/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/macos/web/pnpm-lock.yaml

      - name: Build web UI
        run: |
          pnpm --dir apps/macos/web install --frozen-lockfile
          pnpm --dir apps/macos/web build

      - name: Generate project
        run: |
          xcodegen generate --spec apps/macos/project.yml
          test -d apps/macos/Steno.xcodeproj
          plutil -lint apps/macos/Steno/Info.plist

      - name: Resolve packages
        run: |
          # shellcheck disable=SC2086
          xcodebuild -resolvePackageDependencies -scheme Steno $XCODEBUILD_FLAGS -derivedDataPath "$DERIVED_DATA"

      # `xcodebuild-quiet.sh` keeps the full log in a file (uploaded below)
      # and shows diagnostics, test lines and the result line only. The app
      # builds first so the hostless unit tests find Steno.app in the
      # products directory (InfoPlistTests). The UI smoke test is the
      # `ui-smoke` job below: Xcode 27 on the Forge runner aborts inside
      # IDELaunchServicesLauncher when launching an XCUITest runner
      # (`INTERNAL ERROR: childPID > 0`), while the hosted image passed
      # spike S1.
      - name: Build app
        run: |
          # shellcheck disable=SC2086
          apps/macos/scripts/xcodebuild-quiet.sh apps/macos/build/build.log 'BUILD SUCCEEDED' -- \
            build -scheme Steno $XCODEBUILD_FLAGS -derivedDataPath "$DERIVED_DATA"

      - name: Unit tests
        run: |
          # shellcheck disable=SC2086
          apps/macos/scripts/xcodebuild-quiet.sh apps/macos/build/unit.log 'TEST SUCCEEDED' -- \
            test -scheme StenoTests $XCODEBUILD_FLAGS -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath apps/macos/build/unit.xcresult

      - name: Test summary
        if: always()
        run: python3 apps/macos/scripts/xcresult-summary.py apps/macos/build/unit.xcresult

      - name: Upload logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-output
          path: |
            apps/macos/build/*.log
            apps/macos/build/*.xcresult
          if-no-files-found: warn

      - name: Save DerivedData (hosted runners, main only)
        if: runner.environment == 'github-hosted' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/macos/build/DerivedData/SourcePackages
            apps/macos/build/DerivedData/Build
          key: steno-app-${{ runner.os }}-hosted-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/macos/project.yml', 'Package.swift', 'Package.resolved') }}-${{ github.sha }}

  # The one UI smoke test (LaunchSmokeTests), always on the GitHub-hosted
  # image: spike S1 showed XCUITest launches there, and the self-hosted
  # Forge runner's Xcode 27 cannot launch a test runner from xcodebuild
  # (see the `app` job). Hard-required; it is the app's end-to-end proof
  # beside the manual checklist.
  ui-smoke:
    name: UI smoke test (hosted)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODEBUILD_FLAGS: >-
        -project apps/macos/Steno.xcodeproj
        -configuration Debug
        -destination platform=macOS,arch=arm64
        -derivedDataPath apps/macos/build/DerivedData
        -skipPackagePluginValidation
        -skipMacroValidation
        CODE_SIGN_IDENTITY=-
        CODE_SIGN_STYLE=Manual
        DEVELOPMENT_TEAM=
        COMPILER_INDEX_STORE_ENABLE=NO
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Swift version
        id: swift
        run: |
          swift --version
          version="$(swift --version 2>&1 | head -n 1 | tr -c 'A-Za-z0-9.\n' '-')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install xcodegen
        run: apps/macos/scripts/install-xcodegen.sh

      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/macos/build/DerivedData/SourcePackages
            apps/macos/build/DerivedData/Build
          key: steno-ui-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/macos/project.yml', 'Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            steno-ui-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/macos/project.yml', 'Package.swift', 'Package.resolved') }}-
            steno-ui-${{ runner.os }}-${{ steps.swift.outputs.version }}-

      # The web UI is built here with pnpm so the Xcode pre-build phase only
      # copies dist/ into the bundle (scripts/build-web.sh).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/macos/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/macos/web/pnpm-lock.yaml

      - name: Build web UI
        run: |
          pnpm --dir apps/macos/web install --frozen-lockfile
          pnpm --dir apps/macos/web build

      - name: Generate project
        run: xcodegen generate --spec apps/macos/project.yml

      - name: Resolve packages
        run: |
          # shellcheck disable=SC2086
          xcodebuild -resolvePackageDependencies -scheme Steno $XCODEBUILD_FLAGS

      - name: UI smoke test
        run: |
          # shellcheck disable=SC2086
          apps/macos/scripts/xcodebuild-quiet.sh apps/macos/build/ui.log 'TEST SUCCEEDED' -- \
            test -scheme Steno -only-testing:StenoUITests $XCODEBUILD_FLAGS \
            -resultBundlePath apps/macos/build/ui.xcresult

      - name: Test summary
        if: always()
        run: python3 apps/macos/scripts/xcresult-summary.py apps/macos/build/ui.xcresult

      # The screenshots the smoke tests attach with `.keepAlways` (the
      # redesign's review evidence), exported beside the bundle so the
      # artefact lists them by name without a Mac. The script prints every
      # name into the step summary and fails when one of the matrix's twelve
      # is missing, which an incomplete smoke run already is.
      - name: Export attachments
        if: always()
        run: |
          set -o pipefail
          if [ -d apps/macos/build/ui.xcresult ]; then
            mkdir -p apps/macos/build/attachments
            xcrun xcresulttool export attachments --path apps/macos/build/ui.xcresult \
              --output-path apps/macos/build/attachments
            python3 apps/macos/scripts/attachment-names.py apps/macos/build/attachments \
              main-light-empty.png main-light-selected.png main-light-recording.png \
              onboarding-light-page-1.png onboarding-light-page-2.png \
              settings-light-recording.png \
              main-dark-empty.png main-dark-selected.png main-dark-recording.png \
              onboarding-dark-page-1.png onboarding-dark-page-2.png \
              settings-dark-recording.png \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-smoke-output
          path: |
            apps/macos/build/*.log
            apps/macos/build/*.xcresult
            apps/macos/build/attachments
          if-no-files-found: warn

      - name: Save DerivedData (main only)
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/macos/build/DerivedData/SourcePackages
            apps/macos/build/DerivedData/Build
          key: steno-ui-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/macos/project.yml', 'Package.swift', 'Package.resolved') }}-${{ github.sha }}
