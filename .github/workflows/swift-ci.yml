name: Swift CI

# Builds, lints and tests the Swift package on the GitHub-hosted macOS runner
# (the Forge runner takes over through `MACOS_RUNS_ON` once it is registered).
# Path-gated so it does nothing for unrelated changes.
#
# What every run reports (see `.plans/2026-09-25-v1-program.md`, verification
# standard): `swift format lint --strict`, `swift test --parallel
# --xunit-output`, a step summary with totals and every skipped test's name and
# message, and a failure when a skip message names none of the `STENO_*`
# opt-in switches. `.build` is cached on `Package.resolved`, the Swift version
# and a hash of the sources, with the resolved-only key as a fallback, so a
# run never restores exactly the state of an earlier tree. Sixty minutes
# because FluidAudio and WhisperKit compile cold in 15 to 25 minutes once
# their workstreams land.

on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'apps/macos/**'
      - '.github/workflows/swift-ci.yml'
  push:
    branches: ['main']
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'apps/macos/**'
      - '.github/workflows/swift-ci.yml'

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Build and test package
    # MACOS_RUNS_ON holds a JSON value: the string "macos-15" today, a label
    # array such as ["self-hosted","macOS","ARM64"] once the Forge runner is
    # registered. fromJSON turns either into a runner label.
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '"macos-15"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest-stable`: the toolchain decides how `swift format`
      # lays code out and which Swift Testing / xunit shape we parse below.
      # Xcode 16.4 is Swift 6.1, the version GRDB 7.11 requires.
      # Hosted runners only: the self-hosted Forge runner ships one Xcode and
      # no 16.4, so there we rely on the preinstalled toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: '16.4'

      - name: Swift version
        id: swift
        run: |
          swift --version
          version="$(swift --version 2>&1 | head -n 1 | tr -c 'A-Za-z0-9.\n' '-')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # SwiftPM writes absolute paths into `.build/workspace-state.json`
      # (binary artifacts such as FluidAudio's NemoTextProcessing.xcframework),
      # so a `.build` saved by one self-hosted runner does not build on
      # another: the two runners on Forge share a machine but not a workspace
      # path, and a run that restored the other runner's cache failed with
      # "There is no XCFramework found at .../actions-runner-macos-steno-2/...".
      # Hosted runners get a fresh workspace at the same path every time, so
      # they share one key.
      - name: Cache scope
        id: cache-scope
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            echo "scope=$RUNNER_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "scope=hosted" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ steps.cache-scope.outputs.scope }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ steps.cache-scope.outputs.scope }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-
            swift-build-${{ runner.os }}-${{ steps.cache-scope.outputs.scope }}-${{ steps.swift.outputs.version }}-

      - name: Lint formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Build
        run: swift build --build-tests

      # The reports live outside the cached `.build`, so a run whose test step
      # dies before writing can never summarise an earlier run's XML.
      - name: Test
        id: test
        run: |
          rm -rf test-results && mkdir -p test-results
          swift test --parallel --skip-build --xunit-output test-results/junit.xml

      # `--xunit-output` writes XCTest results to junit.xml and Swift Testing
      # results to junit-swift-testing.xml (a `<skipped>` element carries the
      # skip comment). Totals and every skip land in the step summary; a skip
      # whose message names no `STENO_*` opt-in switch fails the job, so an
      # accidental skip cannot hide.
      - name: Test summary
        if: success() || steps.test.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("test-results/junit*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          skipped, failed = [], []
          for path in files:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else root.iter("testsuite")
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.get(key, "0") or 0)
              for case in root.iter("testcase"):
                  name = f'{case.get("classname", "")}/{case.get("name", "")}'
                  skip = case.find("skipped")
                  if skip is not None:
                      message = (skip.get("message") or skip.text or "").strip()
                      skipped.append((name, message))
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append(name)

          lines = ["## Swift tests", ""]
          if not files:
              lines.append("No xunit output found under `test-results/junit*.xml`.")
          lines.append("| Tests | Failures | Errors | Skipped |")
          lines.append("|---|---|---|---|")
          lines.append(f'| {totals["tests"]} | {totals["failures"]} | {totals["errors"]} | {totals["skipped"]} |')
          lines.append("")
          if failed:
              lines.append("### Failed")
              lines.extend(f"- `{name}`" for name in failed)
              lines.append("")
          if skipped:
              lines.append("### Skipped")
              lines.extend(f"- `{name}`: {message or '(no message)'}" for name, message in skipped)
              lines.append("")
          for source in files:
              lines.append(f"Source: `{source}`")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(summary)

          bad = [name for name, message in skipped if "STENO_" not in message]
          if bad:
              print("::error::skipped tests whose message names no STENO_* opt-in switch: " + ", ".join(bad))
              sys.exit(1)
          if not files:
              print("::error::no xunit output was produced")
              sys.exit(1)
          PY

      # A golden mismatch writes the actual bytes beside the golden as
      # `<name>.actual` (see StenoCore/Testing/Snapshot.swift); uploading them
      # lets a developer without a Mac inspect or adopt the runner's output.
      # The junit files must exist, so a missing upload fails the job instead
      # of passing silently.
      - name: Upload xunit output and snapshot mismatches
        if: success() || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-results/junit*.xml
            Tests/Fixtures/**/*.actual
          if-no-files-found: error
