# The Rust workspace: core crates under crates/, the Tauri shell under
# apps/desktop. Plan: .plans/2026-10-02-rust-core-and-tauri-shell.md.
# Dependency direction mirrors the Swift package: steno-core depends on nothing
# of ours; every other crate depends on steno-core; the shell and the CLI wire
# them together.
[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor of the dependency tree, checked by the `msrv` job in rust-ci.yml:
# tauri 2.12 declares 1.90 (edition 2024 alone needs 1.85, let chains 1.88).
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/NicolaiSchmid/steno"
publish = false

# Shared dependency versions live here and nowhere else; crates inherit them
# with `workspace = true`. No `serde_json/preserve_order`: every writer sorts
# keys itself (`steno-core`'s `json.rs` and `json/printer.rs`), so the default
# map is the right one.
[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-build = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.13"
# The platform keyrings behind the shell's `SecretStore`; the platform
# features are chosen per target in apps/desktop/src-tauri/Cargo.toml.
keyring = "3.6"
# `sync` for the shell's one-shot channels; `macros`, `rt` and
# `rt-multi-thread` for the executor the core's boundary tests run on.
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "rt-multi-thread"] }
# macOS only: non-activating floating panels and the microphone TCC prompt
# (with `objc2` below).
tauri-nspanel = "2.1"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
# The digit source of `steno-bridge`'s `json::write_number`: shortest
# round-trip digits with ties to even, as Foundation breaks them and Rust's
# `Display` does not. Already in the lock through serde_json.
zmij = "1"
# The audio crate: decoding of recordings and phone files in pure Rust.
symphonia = { version = "0.5", default-features = false, features = ["aac", "caf", "isomp4", "mp3", "pcm", "wav"] }
# Build only
cc = "1"
# Test only
similar = "2"
# Temporary directories in tests; `steno-diarize` also downloads each model
# into a temporary file of its own.
tempfile = "3"
# Dyn-compatible async traits for the boundaries and the content hash every
# delivery receipt carries; their executor is `tokio` above, whose blocking
# pool `steno-diarize` also runs its model calls on.
async-trait = "0.1"
sha2 = "0.10"
# Apple frameworks through madsmtm's generated bindings (one objc2 runtime
# for CoreML and CoreAudio now, AppKit later). Pulled in only by crates'
# `cfg(target_os = "macos")` dependency tables, so the other platforms never
# build them.
objc2 = "0.6"
objc2-core-ml = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString", "NSURL", "NSUUID", "NSValue"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString"] }
# Adapters: IANA time zones for the dates in the notes (Swift's `TimeZone`),
# the machine's zone name, and the canonical decomposition `Slug` strips
# diacritics with (the core's `Person::names_match` folds names with it too).
chrono-tz = "0.10"
iana-time-zone = "0.1"
unicode-normalization = "0.1"
# The LLM crate: the HTTP client over rustls (no OpenSSL; the `ring`
# provider, which builds with `cc` on all three platforms, installed by
# `steno-llm` itself), bounded concurrency for the chunked passes, the path
# a decode failure names, and URL handling.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_path_to_error = "0.1"
url = "2"
# The diarization crate: the test WAV reader, ONNX Runtime (rustls TLS,
# prebuilt binaries), the FFT behind the fbank front end and the model
# download.
hound = "3"
rustfft = "6"
# Speech (WP4a): ONNX Runtime, pinned to one release candidate because the
# 2.0 API still moves between them (`download-binaries` fetches pyke's static
# CPU build at compile time over `tls-rustls`, so no system OpenSSL is
# needed to build); the FFT behind the mel features; text language
# identification; the download client of the model store (rustls with
# ring: no system TLS library on Linux, no assembler on Windows). `ort` and
# `ureq` carry the features both crates need.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
realfft = "3"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
whatlang = "0.18"
# The handover listener: TLS (rustls, the LLM line above, on ring; TLS 1.3
# only is set in code; aws-lc-rs needs cmake and NASM on Windows), the
# minted identity (rcgen, time), HTTP/1.1, Bonjour, the pairing secrets
# (rand) and the QR URL (percent-encoding).
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mdns-sd = "0.21"
percent-encoding = "2"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls-pki-types = "1"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }
# The interfaces the listener and the Bonjour record may use (already in
# the tree through mdns-sd).
if-addrs = "0.15"
# Device names counted the way Swift's `String.count` counts them, in
# grapheme clusters. The version already in the lock.
unicode-segmentation = "1.13.3"
# Windows only: each adapter's type and hardware flag, which if-addrs does
# not report (`GetIfTable2` from IpHelper, `IfOperStatusUp` from Ndis,
# `NO_ERROR` from Foundation). The version if-addrs already locks.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
# Test only: the pinned phone-like client (reqwest, the LLM line above,
# with a preconfigured rustls config) and the X.509 checks on the minted
# certificate; `wire_contract.rs` reads the phone's TypeScript.
regex = "1"
x509-parser = { version = "0.18", features = ["verify"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
