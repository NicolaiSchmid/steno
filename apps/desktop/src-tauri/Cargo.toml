[package]
name = "steno-desktop"
description = "The Tauri shell: three windows around the Steno web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
serde_json.workspace = true
tauri-build = "2.7"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = "2.12"
tauri-plugin-opener = "2.7"
thiserror.workspace = true

[features]
default = ["fixture-host"]
# Answers the bridge from the recorded fixtures (WP3). WP6 turns it off and
# wires the real host.
fixture-host = []
# Embeds the web `dist/` instead of loading `devUrl`; `cargo tauri build`
# turns it on. A release build without it still loads the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
