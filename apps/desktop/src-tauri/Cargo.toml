[package]
name = "steno-desktop"
description = "The Tauri shell: three windows around the Steno web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
serde_json.workspace = true
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The contract's types (errors, topics, windows, sections, params), so the
# shell spells nothing of the wire itself; the core for the UUID codec the
# contract's ids use.
steno-bridge = { path = "../../../crates/steno-bridge" }
steno-core = { path = "../../../crates/steno-core" }
# The real host over the services graph (WP6b): the view models, and the
# store, pipeline, recorder and handover listener behind them.
steno-host = { path = "../../../crates/steno-host" }
steno-services = { path = "../../../crates/steno-services" }
tauri.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "signal"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

# Unix only: reads the exit signals' inherited dispositions at launch, so a
# signal `nohup` or a background job ignored stays ignored (`ignored` in
# `main.rs`). Already in the lock through tokio.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gdk.workspace = true
gio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel.workspace = true
objc2.workspace = true
objc2-av-foundation.workspace = true
block2.workspace = true

# The work packages named here are in .plans/2026-10-02-rust-core-and-tauri-shell.md.
[features]
default = []
# Answers the bridge from the recorded fixtures in apps/macos/web/fixtures/bridge/
# instead of the real host (WP3 of the plan): opt in for UI work without a
# database, `cargo run -p steno-desktop --features fixture-host`.
fixture-host = []
# Embeds the web `dist/` instead of loading `devUrl`; `cargo tauri build`
# turns it on. A release build without it still loads the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
