# Steno: for app-steno\x2ddesktop@autostart.service, the unit
# systemd-xdg-autostart-generator makes from Steno's autostart entry, the
# time Steno gets to save a recording in progress when the session stops
# it. The generator gives the unit TimeoutStopSec=5s; the save may take up
# to ten seconds, and the process ends two seconds after it at the latest.
[Service]
TimeoutStopSec=20s
