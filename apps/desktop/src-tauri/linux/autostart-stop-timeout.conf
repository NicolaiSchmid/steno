# Steno: the time an autostarted Steno gets to save a recording in progress
# when the session stops it. systemd-xdg-autostart-generator gives the unit
# it makes from Steno's autostart entry TimeoutStopSec=5s; the save may take
# up to ten seconds, and the process ends two seconds after it at the latest.
[Service]
TimeoutStopSec=20s
