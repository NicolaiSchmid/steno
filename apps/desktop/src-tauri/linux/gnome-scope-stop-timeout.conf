# Steno: for app-gnome-steno\x2ddesktop-<pid>.scope, the scope GNOME starts
# Steno in (at login, from the dash or the app grid), the time Steno gets
# to save a recording in progress when the session stops it.
# gnome-session's app-gnome-.scope.d/override.conf gives every such scope
# TimeoutStopSec=5s; drop-ins apply in file name order, so this file is
# named to sort after it. The save may take up to ten seconds, and the
# process ends two seconds after it at the latest.
[Scope]
TimeoutStopSec=20s
