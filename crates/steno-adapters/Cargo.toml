[package]
name = "steno-adapters"
description = "Steno's destinations (the Obsidian folder) and the meeting export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Only for `json::to_canonical_string`, the Foundation-style pretty printer
# `meeting.json` is written with. It belongs in `steno-core`; the move waits
# for the bridge-on-core refactor, which makes the bridge depend on the core.
# Until then a copy in the core would be a second printer to keep
# byte-identical.
steno-bridge = { path = "../steno-bridge" }
steno-core = { path = "../steno-core" }

async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true

[dev-dependencies]
# The doctests render the core's sample export.
steno-core = { path = "../steno-core", features = ["testing"] }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
