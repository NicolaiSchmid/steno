[package]
name = "steno-adapters"
description = "Steno's destinations (the Obsidian folder) and the meeting export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `ObsidianFolderDestination::with_step_hook`: the tests stop a delivery at a
# chosen step to run a race in a fixed order.
testing = []

[dependencies]
steno-core = { path = "../steno-core" }

async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `Destination::deliver` runs the blocking delivery under `spawn_blocking`.
tokio.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true

[dev-dependencies]
# The doctests render the core's sample export.
steno-core = { path = "../steno-core", features = ["testing"] }
steno-adapters = { path = ".", features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
