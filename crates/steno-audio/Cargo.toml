[package]
name = "steno-audio"
description = "Steno's capture backends, lock-free rings, echo cancellation, recording writer, meeting detection and decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
links = "speexdsp"

[features]
# What a test holds until it releases it: the synthetic backend's held
# outages (`SyntheticOptions::hold_outages`, a device change or stall) and
# a writer's held syncs (`testing::HeldSyncs`). Only the tests turn it on,
# through `[dev-dependencies]` (here and in `steno-services`), so no build
# of the shell or the CLI carries it.
test-support = []

[dependencies]
steno-core = { path = "../steno-core" }
chrono.workspace = true
serde.workspace = true
symphonia.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-audio.workspace = true
objc2-core-audio-types.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire.workspace = true
serde_json.workspace = true

[build-dependencies]
cc.workspace = true

[dev-dependencies]
# The integration tests hold an outage (`hold_outages`) or a sync
# (`HeldSyncs`).
steno-audio = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
