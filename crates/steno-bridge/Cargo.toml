[package]
name = "steno-bridge"
description = "The JSON contract between the Steno host and the web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
# `float_roundtrip`: the default float parser is fast but not always
# correctly rounded; with it, every double this crate prints parses back to
# the same bits (`tests/json.rs`). Additive on top of the workspace line.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
uuid.workspace = true
# The digit source of `json::write_number`: shortest round-trip digits with
# ties to even, as Foundation breaks them and Rust's `Display` does not.
# Already in the lock through serde_json; pinned here, not in the workspace
# table, because only this crate reads it and the table belongs to WP1's PR.
zmij = "1"

[dev-dependencies]
similar.workspace = true

[lints]
workspace = true
