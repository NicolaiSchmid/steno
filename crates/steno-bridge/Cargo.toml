[package]
name = "steno-bridge"
description = "The JSON contract between the Steno host and the web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
# `float_roundtrip`: the default float parser is fast but not always
# correctly rounded; with it, every double this crate prints parses back to
# the same bits (`tests/json.rs`). Additive on top of the workspace line.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
similar.workspace = true

[lints]
workspace = true
