[package]
name = "steno-cli"
description = "The steno command line tool: record, process, export, deliver and the developer tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "steno"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
steno-adapters = { path = "../steno-adapters" }
steno-audio = { path = "../steno-audio" }
steno-bridge = { path = "../steno-bridge" }
# The fakes `process` runs without --engine, as the Swift CLI did.
steno-core = { path = "../steno-core", features = ["testing"] }
# The ONNX diarizer only; the CoreML diarizer is not wired.
steno-diarize = { path = "../steno-diarize", default-features = false, features = ["onnx"] }
steno-handover = { path = "../steno-handover" }
steno-host = { path = "../steno-host" }
steno-llm = { path = "../steno-llm" }
steno-pipeline = { path = "../steno-pipeline" }
steno-services = { path = "../steno-services" }
steno-speech = { path = "../steno-speech" }
# On every platform, unlike the services crate: `dev bakeoff` scores with its
# platform-independent `wer` module; the CoreML half compiles on macOS only.
steno-speech-coreml = { path = "../steno-speech-coreml" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
uuid.workspace = true

[dev-dependencies]
steno-llm = { path = "../steno-llm", features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
