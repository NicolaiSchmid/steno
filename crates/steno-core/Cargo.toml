[package]
name = "steno-core"
description = "Steno's domain types, SQLite store and settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The fakes in `testing`: every protocol with a deterministic implementation
# so the pipeline, the CLI and the shell test without models or a network;
# and `Store::probe_commits`, which reads each write transaction's pragmas
# right before it commits.
testing = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
directories.workspace = true
rusqlite.workspace = true
serde.workspace = true
# `float_roundtrip`: the default float parser is fast but not always
# correctly rounded; with it, every double the printer writes parses back
# to the same bits (`steno-bridge/tests/json.rs`). Additive on top of the
# workspace line.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
zmij.workspace = true

# `ENOLCK` and `ENOTSUP`: a filesystem without locks (`database_lock`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
similar.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
