[package]
name = "steno-host"
description = "The view models behind Steno's windows and the bridge host over the store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The fakes in `fakes` and the core's `testing` fakes behind the boundaries
# the host consumes (`InMemorySecretStore`): what the tests and the CLI's
# dry run build their `Services` from. `steno-services` turns it on for the
# platform services the shell does not supply (see that crate's manifest).
fakes = ["steno-core/testing"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
steno-bridge = { path = "../steno-bridge" }
steno-core = { path = "../steno-core" }
thiserror.workspace = true
# The core's boundaries are async; the host runs blocking (see the crate
# doc), so it owns one current-thread runtime to wait on them, with the
# timer and I/O drivers a real secret store may need.
tokio = { workspace = true, features = ["net", "rt", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The crate's own tests and doctests see the fakes without extra flags.
steno-host = { path = ".", features = ["fakes"] }
tempfile.workspace = true

[lints]
workspace = true
