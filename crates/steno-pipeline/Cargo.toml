[package]
name = "steno-pipeline"
description = "The post-meeting pipeline: orchestration, intakes and the retention sweep over steno-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `fixtures::two_lane_call`, the recorded call the integration tests here
# and in the services crate process, and `fixtures::CapturedLog`, what
# their privacy tests read of the log.
testing = ["dep:tracing-subscriber"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
# `catch_unwind` on a claimed operation, so a panic is reported.
futures-util.workspace = true
# The JSON files in `files`: `preferences.json` and `export-retries.json`.
serde.workspace = true
serde_json.workspace = true
steno-core = { path = "../steno-core" }
# A temporary file of each writer's own for the durable writes in `files`.
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# Additive on the workspace line: `MoveFileExW` with `MOVEFILE_WRITE_THROUGH`
# for the durable renames in `files`, the folder flush's access flags,
# `GetVolumeInformationByHandleW` for the drive's file system and
# `GetDriveTypeW` for a network drive.
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
steno-core = { path = "../steno-core", features = ["testing"] }
steno-pipeline = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
