[package]
name = "steno-services"
description = "The services assembly: the real object graph from the settings, handed to steno-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
fs4.workspace = true
png.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
steno-adapters = { path = "../steno-adapters" }
steno-audio = { path = "../steno-audio" }
steno-bridge = { path = "../steno-bridge" }
steno-core = { path = "../steno-core" }
# The ONNX diarizer only; the CoreML diarizer is not wired.
steno-diarize = { path = "../steno-diarize", default-features = false, features = ["onnx"] }
steno-handover = { path = "../steno-handover" }
# The host's fakes for the platform services the shell does not supply yet
# (permissions, clip player; the updater and the login item when the shell
# passes none). The plan's "Pipeline and services (WP6b)" list says
# why for each.
steno-host = { path = "../steno-host", features = ["fakes"] }
steno-llm = { path = "../steno-llm" }
steno-pipeline = { path = "../steno-pipeline" }
steno-speech = { path = "../steno-speech" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
steno-speech-coreml = { path = "../steno-speech-coreml" }

# The Keychain (`secrets::KeyringSecretStore`); Linux builds the crate
# without using it.
[target.'cfg(not(windows))'.dependencies]
keyring.workspace = true

# The credential store (`secrets::credentials`): `CredReadW`, `CredWriteW`,
# `CredDeleteW` and `CredFree`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Credentials"] }

# The Secret Service client (`secrets::SecretServiceStore`).
[target.'cfg(target_os = "linux")'.dependencies]
base64.workspace = true
futures-util.workspace = true
zbus.workspace = true

[dev-dependencies]
steno-core = { path = "../steno-core", features = ["testing"] }
steno-llm = { path = "../steno-llm", features = ["testing"] }
steno-pipeline = { path = "../steno-pipeline", features = ["testing"] }
rqrr.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
# The paused clock of the update check's timeout test.
tokio = { workspace = true, features = ["test-util"] }

# The Windows tests write entries as the `keyring` crate wrote them before
# the services kept credentials on this computer, and read the services'
# entries back through it.
[target.'cfg(windows)'.dev-dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[lints]
workspace = true
