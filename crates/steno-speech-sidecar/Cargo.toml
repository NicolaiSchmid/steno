[package]
name = "steno-speech-sidecar"
description = "The child process that runs Steno's ONNX speech engine off the app's process, driven over stdin and stdout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "steno-speech-sidecar"
path = "src/main.rs"

[dependencies]
steno-core = { path = "../steno-core" }
steno-speech = { path = "../steno-speech" }
memory-stats.workspace = true
serde.workspace = true

# Unix only: the child ignores SIGINT, SIGTERM and SIGHUP (`serve`), so the
# signals that end the app do not end its job first, and exits through
# `_exit` once stdout breaks (`send`). Already in the lock through tokio.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
