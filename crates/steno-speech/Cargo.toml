[package]
name = "steno-speech"
description = "Steno's speech pipeline: VAD, pause-aligned chunker, TDT greedy decoder, overlap merge, the ONNX Runtime backend, the sidecar client and the model store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
steno-core = { path = "../steno-core" }
ort.workspace = true
realfft.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true
whatlang.workspace = true

# DirectML on Windows (`onnx::EncoderProvider::DirectMl`). It changes no
# binary: pyke publishes only DirectML builds of ONNX Runtime for Windows, so
# the build `download-binaries` fetches there is the same with or without
# the feature, which only adds `ort::ep::DirectML` to the API. Elsewhere the
# feature stays off (no Linux or macOS build carries DirectML).
[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }

# Linux only: the child's own systemd scope (`sidecar::scope`), asked of
# the user manager over the user bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[dev-dependencies]
# The decoder's resamplers, for the FLEURS comparison of 44.1 and 48 kHz.
steno-audio = { path = "../steno-audio" }
tempfile.workspace = true

[lints]
workspace = true
