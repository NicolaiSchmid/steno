<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Steno</title>
  <desc id="desc">Bot-free meeting recorder for the Mac. Local-first, macOS 15 and later, Apple Silicon, writes to Obsidian, MIT licensed.</desc>
  <defs>
    <radialGradient id="glow" cx="0.18" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1280" height="360" rx="28" fill="#000000"/>
    <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="1279" height="359" rx="27.5" fill="none" stroke="rgba(255,255,255,0.102)"/>
    <rect x="160" y="266" width="700" height="1" fill="url(#hairline)"/>

    <!-- recording indicator -->
    <circle cx="112" cy="172" r="26" fill="none" stroke="#62b06f" stroke-opacity="0.22" stroke-width="2">
      <animate attributeName="r" values="14;30;14" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="172" r="11" fill="#62b06f"/>

    <text x="158" y="196" font-size="118" font-weight="600" letter-spacing="-5" fill="#ffffff">Steno</text>
    <text x="162" y="242" font-size="28" font-weight="400" fill="#a3a3a3">Bot-free meeting recorder for the Mac.</text>

    <rect x="160" y="286" width="132" height="34" rx="17" fill="rgba(255,255,255,0.031)" stroke="rgba(255,255,255,0.102)"/>
    <text x="226" y="309" text-anchor="middle" font-size="16" fill="#a3a3a3">Local-first</text>
    <rect x="304" y="286" width="122" height="34" rx="17" fill="rgba(255,255,255,0.031)" stroke="rgba(255,255,255,0.102)"/>
    <text x="365" y="309" text-anchor="middle" font-size="16" fill="#a3a3a3">macOS 15+</text>
    <rect x="438" y="286" width="148" height="34" rx="17" fill="rgba(255,255,255,0.031)" stroke="rgba(255,255,255,0.102)"/>
    <text x="512" y="309" text-anchor="middle" font-size="16" fill="#a3a3a3">Apple Silicon</text>
    <rect x="598" y="286" width="110" height="34" rx="17" fill="rgba(255,255,255,0.031)" stroke="rgba(255,255,255,0.102)"/>
    <text x="653" y="309" text-anchor="middle" font-size="16" fill="#a3a3a3">Obsidian</text>
    <rect x="720" y="286" width="70" height="34" rx="17" fill="rgba(255,255,255,0.031)" stroke="rgba(255,255,255,0.102)"/>
    <text x="755" y="309" text-anchor="middle" font-size="16" fill="#a3a3a3">MIT</text>

