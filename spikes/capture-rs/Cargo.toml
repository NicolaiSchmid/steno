[package]
name = "steno-capture-spike"
version = "0.1.0"
edition = "2021"
description = "Spike: CoreAudio process tap + aggregate device + Speex AEC in Rust"
license = "MIT"
publish = false

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSValue", "NSString", "NSUUID", "NSObject", "NSEnumerator"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
hound = "3.5"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
