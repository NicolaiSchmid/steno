[package]
name = "coreml-rs"
version = "0.1.0"
edition = "2021"
description = "Spike: drive FluidAudio's Parakeet TDT v3 CoreML models from Rust"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSString", "NSURL", "NSValue", "NSError", "NSEnumerator"] }
objc2-core-ml = "0.3.2"
serde_json = "1"

[profile.release]
debug = 1
